name: CI

on:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mental_spaces_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Create application.properties
        run: |
          cat > src/main/resources/application.properties << 'EOF'
          spring.application.name=MentalSpaces
          server.port=8080
          spring.datasource.url=jdbc:postgresql://localhost:5432/mental_spaces_test
          spring.datasource.username=test_user
          spring.datasource.password=test_pass
          spring.datasource.driver-class-name=org.postgresql.Driver
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.show-sql=true
          spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
          server.servlet.context-path=/api
          spring.security.user.name=admin
          spring.security.user.password=admin
          security.jwt.secret=ci-jwt-secret-for-testing-only
          security.jwt.expiration=604800000
          logging.level.org.springframework=INFO
          logging.level.mx.sisati=DEBUG
          cloudflare.r2.bucket=r2test
          cloudflare.r2.access-key=test
          cloudflare.r2.secret-key=test
          cloudflare.r2.endpoint=https://test.com
          EOF
      - name: Build & Test with coverage
        run: mvn verify -Dtest='!MentalSpacesApplicationTests'
      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
